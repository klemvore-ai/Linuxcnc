[EMC]
MACHINE = CNCFusion
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = ./cncfusion_gui.py
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.000000
MAX_SPINDLE_OVERRIDE = 1.200000
MIN_SPINDLE_OVERRIDE = 0.500000
DEFAULT_SPINDLE_0_SPEED = 12000
MIN_SPINDLE_0_SPEED = 100
MAX_SPINDLE_0_SPEED = 24000
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 5
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INCREMENTS = 5mm 1mm .5mm .1mm .05mm .01mm .005mm

[KINS]
JOINTS = 4
KINEMATICS = trivkins coordinates=xyyz kinstype=BOTH

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 7.50
MAX_LINEAR_VELOCITY = 75.00

[HAL]
HALUI = halui
HALFILE = CNCFusion.hal
HALFILE = CNCFusion_blueprint.hal
POSTGUI_HALFILE = custom_postgui.hal

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = G21 G40 G90 G94 G97 G64 P0.025

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[AXIS_X]
MAX_VELOCITY = 75.00
MAX_ACCELERATION = 600.00
MIN_LIMIT = -5.000
MAX_LIMIT = 1275.000

[AXIS_Y]

# CNCFusion Installation Paths Configuration
# Copy this file to /etc/cncfusion/paths.conf on the machine
# and edit paths to match your installation.

# LinuxCNC configuration directory (contains .ini, .hal, .tbl files)
CNCFUSION_CONFIG_ROOT=/home/operator/linuxcnc/configs

# G-code directory (nc_files) - where O-code subroutines live
CNCFUSION_GCODE_ROOT=/home/operator/linuxcnc/nc_files

# CNCFusion agent installation directory
CNCFUSION_AGENT_ROOT=/opt/CNCFusion

# Update staging directory (usually doesn't need changing)
CNCFUSION_STAGING_DIR=/var/lib/cncfusion/updates

# Certificate directory (usually doesn't need changing)
CNCFUSION_CERTS_DIR=/etc/cncfusion

# LinuxCNC user (the user who runs LinuxCNC)
CNCFUSION_LINUXCNC_USER=operator

# Agent service user (dedicated service account)
CNCFUSION_AGENT_USER=cncfusion

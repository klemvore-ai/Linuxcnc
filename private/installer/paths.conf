# LinuxCNC Installation Paths Configuration
# Copy this file to /etc/linuxcnc/paths.conf on the machine
# and edit paths to match your installation.

# LinuxCNC configuration directory (contains .ini, .hal, .tbl files)
LINUXCNC_CONFIG_ROOT=/home/operator/linuxcnc/configs

# G-code directory (nc_files) - where O-code subroutines live
LINUXCNC_GCODE_ROOT=/home/operator/linuxcnc/nc_files

# LinuxCNC agent installation directory
LINUXCNC_AGENT_ROOT=/opt/LinuxCNC

# Update staging directory (usually doesn't need changing)
LINUXCNC_STAGING_DIR=/var/lib/linuxcnc/updates

# Certificate directory (usually doesn't need changing)
LINUXCNC_CERTS_DIR=/etc/linuxcnc

# LinuxCNC user (the user who runs LinuxCNC)
LINUXCNC_LINUXCNC_USER=operator

# Agent service user (dedicated service account)
LINUXCNC_AGENT_USER=linuxcnc

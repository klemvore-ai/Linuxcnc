[WINDOW]
width = 1200
height = 900

[PATHS]
export_dir =
last_project_dir =
last_import_hal_dir =
last_ui_dir =
last_gcode_file =
last_local_gcode_dir =
last_tool_table_path =
last_remote_linuxcnc_dir =
last_macro_dir =

[SSH]
# Leave blank when using the secure mTLS agent.
username =
password =
ip_address =

[AGENT]
# Copy the generated CA certificate and client identity to the workstation.
base_url = https://<MACHINE_MANAGEMENT_IP>:9443
ca_file = C:\Users\<USER>\.linuxcnc\ca.crt
client_cert = C:\Users\<USER>\.linuxcnc\client.crt
client_key = C:\Users\<USER>\.linuxcnc\client.key

[MESA]
board_model = 7i76eu
ip_address = <MESA_CONTROL_NETWORK_IP>

[MACHINE_CONFIG]
name = MyLinuxCNC
kinematics = XYZ
units = Metric (mm)
drive_type = Stepper
enable_probe = False
enable_spindle_at_speed = False
enable_spindle_fault = False
enable_tool_change = False
enable_coolant = False
enable_estop = True
spindle_closed_loop = False
shared_home_min_limit = False
display_ui = LinuxCNC
auto_launch_local = False
operator_mode = False

[AXIS_X]
min = 0.0
max = 500.0
vel = 50.0
accel = 250.0
steps = 200.0
units = 1.0
invert_dir = False
backlash = 0.0

[AXIS_Y]
min = 0.0
max = 500.0
vel = 50.0
accel = 250.0
steps = 200.0
units = 1.0
invert_dir = False
backlash = 0.0

[AXIS_Z]
min = -100.0
max = 0.0
vel = 25.0
accel = 150.0
steps = 200.0
units = 1.0
invert_dir = False
backlash = 0.0

[JOG_SETTINGS]
jog_speed = 25.0
turbo_multiplier = 2.0

[PROBING]
# Verify every value and every macro direction on the real machine before use.
tool_setter_x = 0.0
tool_setter_y = 0.0
tool_setter_z = 0.0
probe_vel = 25.0
setter_vel = 25.0
plate_thickness = 0.0
probe_diam = 0.0
xy_clear = 5.0
z_drop = 5.0
search_dist = 10.0
setter_search_dist = 25.0
setter_height = 0.0
setter_ref_z = 0.0

[IO_MAPPING]
# Configure pins through the application or add your verified LinuxCNC HAL pins here.
probe_in =
probe_in_inv = False
estop_ext =
estop_ext_inv = False